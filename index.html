<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPL Mock Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3ff;--card:#fff;--ink:#14173a;--mute:#5f6489;--line:#d9dcf5;--acc:#5b4bff;--ok:#12a36b;--bad:#e5395f;--okbg:#dcf7ec;--badbg:#fde3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1027;--card:#181b3d;--ink:#eceeff;--mute:#9a9fcf;--line:#2c3066;--acc:#8c80ff;--ok:#3fd9a0;--bad:#ff6b8f;--okbg:#123a39;--badbg:#401a33}}
:root[data-theme="dark"]{--bg:#0e1027;--card:#181b3d;--ink:#eceeff;--mute:#9a9fcf;--line:#2c3066;--acc:#8c80ff;--ok:#3fd9a0;--bad:#ff6b8f;--okbg:#123a39;--badbg:#401a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.bl{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--acc);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--bad);bottom:-90px;right:-60px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,50px) scale(1.2)}}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;animation:in .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
h1{font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:20px}
p{color:var(--mute);margin:0 0 16px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 22px;background:var(--acc);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #5b4bff55}.btn:active{transform:scale(.97)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-bottom:10px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:600;color:var(--ink)}
.fire{display:inline-block;animation:pop .5s}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);transition:all .35s}
.dot.cur{background:var(--acc);transform:scale(1.5)}.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}
.chip{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:2px 10px;margin-bottom:12px}
.q{font-size:clamp(18px,4.6vw,22px);font-weight:600;line-height:1.4;margin:0 0 18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(6px)}
.opt b{flex:none;width:28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:13px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop .45s}
.opt.no{border-color:var(--bad);background:var(--badbg);animation:sh .4s}
.opt.dim{opacity:.55}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tp{display:grid;grid-template-columns:140px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.ring{display:block;margin:0 auto 10px}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .r1{stroke:var(--line)}.ring .r2{stroke:var(--acc);stroke-dasharray:377;stroke-dashoffset:377;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.sc{text-align:center;font-size:44px;font-weight:800;margin-top:-108px;height:90px}
.rv{border-left:4px solid var(--bad);padding:6px 12px;margin:10px 0;font-size:14px;background:var(--badbg);border-radius:0 10px 10px 0}
.rv small{display:block;color:var(--mute)}
.cf{position:fixed;top:-10px;width:9px;height:14px;z-index:9;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:520px){.tp{grid-template-columns:100px 1fr 38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bl b1"></div><div class="bl b2"></div>
<main id="app"></main>
<script>
const T={D:"Language Design",S:"Syntax & Semantics",B:"Binding & Scope",Y:"Type Systems",E:"Expressions & Conversion",R:"Error Handling",P:"Subprograms",M:"Memory & GC",C:"Calling Sequence",A:"Parameters",G:"Templates",X:"Metaprogramming"};
// [topic, question, correct, wrong1, wrong2, wrong3]
const Q=[
["D","Which set lists the four major language evaluation criteria?","Readability, writability, reliability, cost","Speed, size, color, price","Syntax, semantics, pragmatics, cost","Portability, beauty, age, license"],
["D","Orthogonality means a language has…","A few primitives that combine in consistent ways","Many special-case rules","Only one data type","No type checking"],
["D","Which paradigm centers on functions and avoids mutable state?","Functional","Imperative","Procedural","Assembly"],
["D","Prolog is a well-known example of which paradigm?","Logic","Object-oriented","Functional","Scripting"],
["D","The imperative paradigm is centered on…","Statements that change program state","Facts and rules","Pure mathematical functions","Message passing only"],
["D","Which feature mainly improves a language’s reliability?","Type checking and exception handling","Shorter keywords","More operators","Dynamic scope"],
["D","Writability describes how easily a language…","Lets programmers create programs","Is read by others","Runs on hardware","Is compiled"],
["S","Syntax describes the ___ of a program; semantics describes its ___.","Form; meaning","Meaning; form","Speed; size","Types; scope"],
["S","In BNF, a non-terminal is…","A symbol replaced using grammar rules","A literal token that never changes","A comment","A runtime value"],
["S","A grammar is ambiguous if…","One string has more than one parse tree","It has no rules","It has no terminals","Every rule is recursive"],
["S","Compared with a parse tree, an AST…","Drops unneeded syntactic detail","Keeps every token","Is produced at runtime","Is only used by interpreters"],
["S","Associativity decides…","Order of operators with equal precedence","Which operator is faster","Variable lifetime","Memory layout"],
["S","Lexical analysis converts source code into…","Tokens","Parse trees","Machine code","Types"],
["S","EBNF adds which notations to BNF?","Optional [ ] and repetition { }","Pointers and heaps","Type casts","Comments"],
["S","Which is a static semantic check?","Type compatibility at compile time","Division by zero","Heap exhaustion","Input validation"],
["S","The dangling-else problem is an example of…","Grammar ambiguity","A memory leak","Type coercion","Dynamic binding"],
["S","Dynamic semantics describes…","What a program does during execution","Which tokens are legal","Compile-time type rules","Grammar productions"],
["S","Operator precedence is usually encoded in a grammar by…","Putting higher-precedence rules deeper in the tree","Adding comments","Using only terminals","Removing recursion"],
["B","A binding is the association between…","An entity and an attribute","Two variables only","A file and a folder","A token and a rule"],
["B","Static binding happens…","Before runtime and does not change","Only during execution","Every time a variable is used","Only in interpreters"],
["B","Static (lexical) scope is determined by…","The structure of the program text","The call chain at runtime","The operating system","The heap layout"],
["B","Dynamic scope is determined by…","The runtime call chain","Block nesting in the source","Type declarations","Compiler flags"],
["B","The lifetime of a variable is…","The time it is bound to a memory location","Where its name is visible","Its type","Its value"],
["B","A variable’s scope is…","The region where its name is visible","The time it exists","Its memory address","Its data type"],
["B","Late (dynamic) binding of method calls enables…","Polymorphism","Faster compilation","Static typing only","Manual memory control"],
["Y","In a statically typed language, types are checked…","At compile time","Only at runtime","Never","By the OS"],
["Y","Which language is dynamically typed?","Python","Java","C","Rust"],
["Y","Strong typing means the language…","Prevents operations on incompatible types","Has no types","Allows any implicit conversion","Is always compiled"],
["Y","Evaluating \"5\" + 1 to \"51\" in JavaScript shows…","Weak typing with implicit coercion","Strong typing","Nominal typing","Static scoping"],
["Y","Nominal typing decides compatibility by…","Declared type names","Structure or shape","Memory size","Run order"],
["Y","Structural typing decides compatibility by…","Matching structure or shape","Declared names","Scope","Allocation area"],
["Y","Type inference lets the compiler…","Deduce types without explicit declarations","Skip type checks","Convert all types to int","Free memory"],
["Y","Generics mainly provide…","Reusable, type-safe code for many types","Faster hardware","Dynamic scope","Garbage collection"],
["Y","Which is NOT a primitive type?","Array","Integer","Boolean","Character"],
["Y","Which is a non-primitive (composite) type?","Class or struct","float","char","boolean"],
["E","Short-circuit evaluation means…","Stopping once the result is determined","Evaluating every operand","Skipping type checks","Reversing operand order"],
["E","With a = false, what happens to b() in (a && b())?","b() is never called","b() is called first","b() is called twice","It causes a compile error"],
["E","Operator overloading allows…","One operator to act differently by operand type","Using no operators","Renaming operators","Operators with side effects only"],
["E","Coercion is a(n)…","Implicit type conversion by the language","Explicit programmer cast","Runtime error","Memory operation"],
["E","Casting is a(n)…","Explicit type conversion by the programmer","Implicit conversion","Compiler optimization","Grammar rule"],
["E","Converting int to double is an example of…","Widening (promotion)","Narrowing (demotion)","Overflow","Truncation"],
["E","Narrowing conversion risks…","Loss of data or precision","Memory leaks","Ambiguity","Dangling pointers"],
["E","Integer overflow occurs when…","A result exceeds the representable range","A pointer is null","A variable is undeclared","A loop never ends"],
["E","Which operator takes three operands?","Ternary ?:","Unary -","Binary +","Assignment ="],
["E","An expression with a side effect…","Changes program state, like i++","Never changes state","Is always constant","Cannot be assigned"],
["E","Referential transparency means an expression can be…","Replaced by its value without changing behavior","Changed at runtime","Hidden from scope","Overloaded"],
["E","Lazy evaluation…","Delays computing a value until it is needed","Computes everything up front","Skips all computation","Is the same as short-circuiting only"],
["R","Which construct is used for exception handling?","try / catch","if / else","for / while","switch / case"],
["R","A finally block…","Runs whether or not an exception occurs","Runs only on errors","Runs only on success","Is never executed"],
["R","Which is a runtime error?","Division by zero","Missing semicolon","Undeclared type name","Unbalanced parentheses"],
["R","Compared with error codes, exceptions…","Separate error handling from normal flow","Are always faster","Cannot propagate","Need no handlers"],
["P","Pass-by-value passes…","A copy of the argument","The variable’s address","Only the name","The return value"],
["P","With pass-by-reference, changes in the callee…","Affect the caller’s variable","Never affect the caller","Are rejected by the compiler","Only affect copies"],
["P","Formal parameters are…","Names in the subprogram definition","Values in the call","Return types","Global variables"],
["P","The call stack stores…","Activation records","The heap","Source code","Tokens"],
["P","An activation record typically holds…","Parameters, locals, and return address","Only global data","Source text","The garbage collector"],
["P","Recursion with no base case causes…","Stack overflow","Memory leak","Dangling pointer","Type error"],
["M","The three main memory allocation areas are…","Static, stack, heap","Cache, disk, RAM","Token, tree, node","Local, global, remote"],
["M","Stack-allocated variables are freed…","Automatically when the function returns","Only by garbage collection","Never","Manually with free()"],
["M","Heap memory is used for…","Dynamically allocated data with flexible lifetime","Only function parameters","Only constants","Return addresses"],
["M","A dangling reference points to…","Memory that has been deallocated","A valid object","A constant","The stack top"],
["M","A memory leak happens when…","Allocated memory is never released","Memory is freed twice","The stack is full","A type is wrong"],
["M","Reference counting fails to reclaim…","Objects in reference cycles","Local variables","Constants","Primitive types"],
["M","Mark-and-sweep garbage collection…","Marks reachable objects, then frees the rest","Frees objects in order of creation","Counts references only","Runs at compile time"],
["M","A pointer is a variable that holds…","A memory address","A type name","A function body","A token"],
["C","The calling sequence is…","The steps taken by caller and callee to call and return from a subprogram","The order of statements in main","The list of formal parameters","The order of variable declarations"],
["C","Which task belongs to the caller in a calling sequence?","Passing arguments and transferring control","Restoring the caller’s frame","Allocating the callee’s locals","Compiling the callee"],
["C","The callee’s prologue typically…","Saves registers and sets up its stack frame","Evaluates the caller’s arguments","Frees the heap","Parses the source code"],
["C","The epilogue of a subprogram…","Restores the frame and returns control to the caller","Declares parameters","Allocates the heap","Starts the program"],
["C","The return address is saved so that…","Execution resumes after the call","Parameters can be renamed","The heap can be freed","Types can be checked"],
["A","Pass-by-value-result is also called…","Copy-in, copy-out","Call by name","Call by address only","Lazy passing"],
["A","In pass-by-name, the argument expression is…","Re-evaluated each time the parameter is used","Evaluated once before the call","Copied to the heap","Ignored"],
["A","A default parameter value is used when…","The caller omits that argument","The argument is null","The function recurses","The type is generic"],
["A","Keyword (named) arguments are matched to parameters by…","Name rather than position","Position only","Type only","Memory address"],
["A","Variadic (varargs) parameters allow…","A variable number of arguments","Only one argument","No arguments","Only constants"],
["G","A template is…","A generic blueprint the compiler uses to produce code for specific types","A runtime type check","A garbage collector","A kind of pointer"],
["G","Template instantiation is when the compiler…","Generates a concrete version for given type arguments","Deletes unused code","Interprets code at runtime","Frees memory"],
["G","Compared with macros, templates are…","Type-checked, not plain text substitution","Always slower","Only runtime features","Unable to take type parameters"],
["G","In a template, the type parameter T is…","A placeholder replaced by a real type","A global variable","A function pointer","A runtime value"],
["G","The two main types of templates in C++ are…","Function templates and class templates","Macro templates and pointer templates","Static templates and dynamic templates","Stack templates and heap templates"],
["G","A single generic max(a, b) that works for int and double is a…","Function template","Class template","Macro","Namespace"],
["G","A generic container such as Stack of T, used as Stack of int, is a…","Class template","Function template","Preprocessor macro","Pointer"],
["G","For a function template, the compiler can usually…","Deduce the type parameter from the call arguments","Skip instantiation","Allocate the type on the heap","Replace it at runtime"],
["X","Metaprogramming is…","Writing programs that generate or manipulate other programs as data","Writing programs without types","Using only macros","Managing memory manually"],
["X","Reflection allows a program to…","Inspect or modify its own structure at runtime","Optimize loops","Allocate registers","Skip compilation"],
["X","A preprocessor macro works by…","Textual expansion before compilation","Runtime type checking","Garbage collection","Stack allocation"],
["X","Which is an example of compile-time metaprogramming?","C++ template metaprogramming","Runtime exceptions","Pass-by-reference","Mark-and-sweep GC"],
["X","A main benefit of code generation is…","Less repetitive boilerplate code","Slower builds","Weaker typing","Manual memory control"]
];
const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
let list,i,score,streak,best,log,lock,t0,tm;
const fmt=s=>(s/60|0)+":"+String(s%60).padStart(2,"0");
const show=h=>{app.innerHTML=h};
function home(){clearInterval(tm);show(`<div class="card"><h1>PPL Mock Exam</h1><p>${Q.length} questions across ${Object.keys(T).length} topics: design, syntax, binding, types, expressions, errors, subprograms, calling sequences, parameters, templates, metaprogramming and memory. Answers are checked instantly.pwidi 1-4 dto ttpwtddt.</p>
<div class="row"><button class="btn" onclick="start(Q)">Start exam</button></div></div>`)}
function start(src){list=sh(src.slice()).map(q=>({t:q[0],q:q[1],c:q[2],o:sh(q.slice(2))}));i=score=streak=best=0;log=[];t0=Date.now();clearInterval(tm);tm=setInterval(()=>{const e=$("#tm");if(e)e.textContent=fmt((Date.now()-t0)/1000|0)},1000);ask()}
function ask(){lock=false;const q=list[i];
const dots=list.map((_,k)=>`<span class="dot ${k==i?"cur":log[k]?(log[k].ok?"ok":"no"):""}"></span>`).join("");
show(`<div class="top"><span class="pill">${i+1} / ${list.length}</span><span class="pill">Score ${score}</span><span class="pill"><span class="fire">${streak>1?"🔥":""}</span> Streak ${streak}</span><span class="pill" id="tm">${fmt((Date.now()-t0)/1000|0)}</span></div>
<div class="dots">${dots}</div>
<div class="card"><span class="chip">${T[q.t]}</span><p class="q" style="color:var(--ink)">${q.q}</p>
${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})"><b>${k+1}</b>${o}</button>`).join("")}
<div class="row" id="nx"></div></div>`)}
function pick(k){if(lock)return;lock=true;const q=list[i],ok=q.o[k]===q.c;
document.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(q.o[n]===q.c)b.classList.add("ok");else if(n===k)b.classList.add("no");else b.classList.add("dim")});
if(ok){score++;streak++;best=Math.max(best,streak)}else streak=0;
log[i]={ok,t:q.t,q:q.q,a:q.o[k],c:q.c};
const dt=document.querySelectorAll(".dot")[i];dt.className="dot "+(ok?"ok":"no");
$("#nx").innerHTML=`<button class="btn" id="nb" onclick="next()">${i+1<list.length?"Next question":"See results"}</button>`;$("#nb").focus()}
function next(){i++;i<list.length?ask():done()}
function done(){clearInterval(tm);const n=list.length,p=Math.round(score/n*100),el=fmt((Date.now()-t0)/1000|0);
const g=p>=90?"Outstanding. You’re exam-ready.":p>=75?"Solid. Polish the weak topics.":p>=60?"Almost there. Review the missed items.":"Keep reviewing. Retry the missed ones.";
const by={};log.forEach(l=>{(by[l.t]=by[l.t]||[0,0])[1]++;if(l.ok)by[l.t][0]++});
const miss=log.filter(l=>!l.ok);
show(`<div class="card"><h1>Results</h1>
<svg class="ring" width="140" height="140" viewBox="0 0 140 140"><circle class="r1" cx="70" cy="70" r="60"/><circle class="r2" id="rg" cx="70" cy="70" r="60" transform="rotate(-90 70 70)"/></svg>
<div class="sc" id="sc">0%</div>
<p style="text-align:center">${g}<br>${score}/${n} correct · time ${el} · best streak ${best}</p>
<h2>By topic</h2>${Object.keys(by).map(k=>{const v=by[k],w=Math.round(v[0]/v[1]*100);return`<div class="tp"><span>${T[k]}</span><div class="bar"><i data-w="${w}"></i></div><span>${v[0]}/${v[1]}</span></div>`}).join("")}
<div class="row" style="margin:18px 0"><button class="btn" onclick="start(Q)">Retake exam</button>${miss.length?`<button class="btn g" onclick="retry()">Retry missed (${miss.length})</button>`:""}</div>
${miss.length?`<h2>Review missed</h2>`+miss.map(m=>`<div class="rv"><b>${m.q}</b><small>You: ${m.a}</small><small>Correct: ${m.c}</small></div>`).join(""):""}</div>`);
setTimeout(()=>{$("#rg").style.strokeDashoffset=377*(1-p/100);document.querySelectorAll(".bar i").forEach(e=>e.style.width=e.dataset.w+"%");
let c=0;const iv=setInterval(()=>{c=Math.min(p,c+2);$("#sc").textContent=c+"%";if(c>=p)clearInterval(iv)},25)},120);
if(p>=75)for(let k=0;k<60;k++){const s=document.createElement("span");s.className="cf";s.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360} 90% 60%);animation-delay:${Math.random()*1.2}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}
function retry(){const ids=new Set(log.filter(l=>!l.ok).map(l=>l.q));start(Q.filter(q=>ids.has(q[1])))}
document.addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4"&&document.querySelector(".opt"))pick(+e.key-1);else if(e.key==="Enter"&&lock&&$("#nb"))next()});
home();
</script></body></html>
